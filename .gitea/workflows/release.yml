name: Release

on:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Linux-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles appimage
        env:
          # Im Runner-Container gibt es kein FUSE für linuxdeploy.
          APPIMAGE_EXTRACT_AND_RUN: 1
      - uses: akkuman/gitea-release-action@v1
        with:
          files: target/release/bundle/appimage/*.AppImage
