[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tsa-core = { path = "crates/core" }
tsa-moodle = { path = "crates/moodle" }
tsa-untis = { path = "crates/untis" }
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
html-escape = "0.2"
regex = "1"
ammonia = "4"
base64 = "0.22"
sha2 = "0.10"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", features = ["json", "form", "multipart", "cookies"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
wiremock = "0.6"
thiserror = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
