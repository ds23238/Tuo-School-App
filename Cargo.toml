[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tsa-core = { path = "crates/core" }
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
