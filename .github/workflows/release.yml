name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Packaging-Änderungen in PRs testen, ohne ein Release zu erstellen.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/msix/**
      - src-tauri/flatpak/**
      - src-tauri/tauri.conf.json

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --bundles msi
      - name: MSIX
        shell: pwsh
        env:
          MSIX_CERT_PFX: ${{ secrets.MSIX_CERT_PFX }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: ./src-tauri/msix/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msix/*

  linux:
    # Älteste unterstützte Basis, damit AppImage und .deb auf möglichst vielen Systemen laufen.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Linux-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - run: cp linux/deb/*.deb src-tauri/flatpak/tsa-sync.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TSA-Sync.flatpak
          manifest-path: src-tauri/flatpak/io.github.ds23238.tsasync.yml
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: TSA-Sync.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
